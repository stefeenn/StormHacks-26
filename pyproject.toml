[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pitch-perfect"
version = "0.1.0"
description = "Pitch Perfect: Interactive MLB Statcast Pitch Arsenal Explorer & Sportsbook Velocity Model"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "flask>=3.0.0",
    "matplotlib>=3.7.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
pitch-perfect = "main:main"
savant-scraper = "main:main"

[tool.setuptools.packages.find]
include = ["scraper*", "web*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

