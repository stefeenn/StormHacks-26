[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "baseball-savant-scraper"
version = "0.1.0"
description = "A modular data scraper for Baseball Savant (Statcast)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
savant-scraper = "main:main"

[tool.setuptools.packages.find]
include = ["scraper*", "web*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

